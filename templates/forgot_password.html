{% extends "base.html" %}
{% block title %}Recuperar senha • Lumen Jurídico{% endblock %}
{% block content %}
<div style="max-width:470px; margin:35px auto;">
  <section class="card" style="padding:28px; border:1px solid #dbeafe; box-shadow:0 12px 30px rgba(15,23,42,.08);">
    <div style="text-align:center; margin-bottom:22px;">
      <div style="font-size:2.1rem;">✉️</div>
      <h1 style="margin:8px 0; color:#0f172a; font-size:1.7rem;">Recuperar senha</h1>
      <p class="muted" style="line-height:1.55;">Informe seu e-mail para receber um link de redefinição.</p>
    </div>

    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label for="email" style="display:block; font-weight:700; color:#334155; margin-bottom:7px;">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required style="width:100%; box-sizing:border-box; padding:12px 13px; border:1px solid #cbd5e1; border-radius:8px; font:inherit; margin-bottom:20px;">
      <button class="btn primary" type="submit" style="width:100%; justify-content:center; padding:13px;">Enviar instruções</button>
    </form>

    <div style="text-align:center; margin-top:18px;">
      <a href="{{ url_for('login') }}" style="color:#2563eb; text-decoration:none; font-weight:600; font-size:.9rem;">← Voltar ao login</a>
    </div>
  </section>
</div>
{% endblock %}
