{% extends "base.html" %}
{% block title %}{{ page_title }} • Lumen Jurídico{% endblock %}
{% block content %}
<div style="max-width:500px; margin:35px auto;">
  <section class="card" style="padding:28px; border:1px solid #dbeafe; box-shadow:0 12px 30px rgba(15,23,42,.08);">
    <div style="text-align:center; margin-bottom:23px;">
      <div style="font-size:2.2rem;">🔑</div>
      <h1 style="margin:8px 0; color:#0f172a; font-size:1.75rem;">{{ page_title }}</h1>
      <p class="muted" style="line-height:1.55;">{{ page_subtitle }}</p>
    </div>

    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label for="password" style="display:block; font-weight:700; color:#334155; margin-bottom:7px;">Nova senha</label>
      <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required style="width:100%; box-sizing:border-box; padding:12px 13px; border:1px solid #cbd5e1; border-radius:8px; font:inherit; margin-bottom:15px;">

      <label for="password_confirm" style="display:block; font-weight:700; color:#334155; margin-bottom:7px;">Confirme a senha</label>
      <input id="password_confirm" name="password_confirm" type="password" minlength="8" autocomplete="new-password" required style="width:100%; box-sizing:border-box; padding:12px 13px; border:1px solid #cbd5e1; border-radius:8px; font:inherit; margin-bottom:10px;">

      <p style="margin:0 0 20px; color:#64748b; font-size:.82rem;">Use pelo menos 8 caracteres e evite senhas reutilizadas.</p>
      <button class="btn primary" type="submit" style="width:100%; justify-content:center; padding:13px;">{{ button_label }}</button>
    </form>
  </section>
</div>
{% endblock %}
